# S-009 — CI matrix. Job ids are part of the contract (branch protection):
#   ci / ubuntu      static gate + unit + frontend build + Playwright (chromium)
#   ci / windows     full Python stack + real-media pytest + cargo fmt/clippy
#   ci / loop-audit  verify_ledger + supervise (read-only)
# Every third-party action is pinned to a commit SHA (supply-chain rule, AC-7).
name: ci

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  FORCE_COLOR: '0'
  CI: 'true'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  ubuntu:
    name: ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout (full history for gitleaks)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks, whole history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: 'true'
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: pnpm (version from package.json#packageManager)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.2.0

      - name: Node 22 + pnpm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Python 3.11 + pip cache
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            ai-engine/requirements.txt
            ai-engine/requirements-tooling.txt

      - name: Install JS workspace
        run: pnpm install --frozen-lockfile

      - name: Install Python tooling venv (ruff, bandit, pip-audit, pytest, web deps)
        run: |
          python -m venv ai-engine/.venv
          ai-engine/.venv/bin/python -m pip install --quiet --upgrade pip
          ai-engine/.venv/bin/python -m pip install --quiet -r ai-engine/requirements-tooling.txt
          ai-engine/.venv/bin/python -m pip install --quiet --no-deps -e ai-engine

      - name: Static gate (15 checks; cargo-clippy is owned by the windows job)
        run: ai-engine/.venv/bin/python scripts/gate.py --stage static --json --strict-missing --skip cargo-clippy | tee gate-static.log

      - name: Unit tests (tests/unit) → junit
        run: ai-engine/.venv/bin/python -m pytest tests/unit -q -p no:cacheprovider -rfEs --junitxml=reports/junit-unit.xml

      - name: Timeline domain (vitest + line coverage)
        working-directory: apps/desktop
        run: pnpm exec vitest run --coverage

      - name: Annotate unit failures (public annotations, no token needed)
        if: always()
        run: python scripts/ci/junit_annotate.py reports/junit-unit.xml

      - name: Frontend build (Turbo → next build, output export)
        run: pnpm run build

      - name: Playwright browsers cache
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Playwright chromium (+ system deps)
        working-directory: apps/desktop
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright — build artifacts + styling (S-007 DOM half)
        working-directory: apps/desktop
        # reporters come from playwright.config.ts: list + html (playwright-report/html) + junit (playwright-report/junit.xml)
        run: pnpm exec playwright test tests/build-artifacts.spec.ts tests/styling.spec.ts tests/media-bin.spec.ts tests/timeline-canvas.spec.ts

      - name: Annotate Playwright failures
        if: always()
        run: python scripts/ci/junit_annotate.py apps/desktop/playwright-report/junit.xml

      - name: Upload ubuntu evidence (junit, playwright-report, gate log, screenshot)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ubuntu-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            reports/junit-unit.xml
            gate-static.log
            apps/desktop/playwright-report/
            docs/loop/evidence/S-007/home-1440x900.png

  # ───────────────────────────────────────────────────────────────────────────
  windows:
    name: windows
    runs-on: windows-2022
    timeout-minutes: 90
    # Job-level override (workflow stays contents: read). Needed so this job can
    # commit the runner-resolved Cargo.lock (BUG-17); the sandbox cannot read
    # blob artifacts or the job-summary body. Other jobs stay read-only.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: pnpm (version from package.json#packageManager)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.2.0

      - name: Node 22 + pnpm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install JS workspace (tsc/biome/turbo for the gate on Windows)
        run: pnpm install --frozen-lockfile

      - name: Python 3.11 + pip cache
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            ai-engine/requirements.txt
            ai-engine/requirements-tooling.txt

      - name: Install full AI stack into ai-engine/.venv (requirements.txt, CPU wheels)
        shell: pwsh
        run: |
          python -m venv ai-engine/.venv
          ai-engine/.venv/Scripts/python.exe -m pip install --quiet --upgrade pip
          ai-engine/.venv/Scripts/python.exe -m pip install --quiet -r ai-engine/requirements.txt
          ai-engine/.venv/Scripts/python.exe -m pip install --quiet -r ai-engine/requirements-tooling.txt
          ai-engine/.venv/Scripts/python.exe -m pip install --quiet --no-deps -e ai-engine
          ai-engine/.venv/Scripts/python.exe -c "import imageio_ffmpeg, sys; print('ffmpeg:', imageio_ffmpeg.get_ffmpeg_exe())"

      - name: Rust stable (rustfmt, clippy) — S-010 hard checks + tauri build
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # v1 (stable branch, 2026-09)
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.2
        with:
          workspaces: apps/desktop/src-tauri

      # Contract probe only. A real GPU pass is the user machine (S-027), not this runner.
      - name: smoke-gpu.ps1 dry-run (contract only, not a GPU pass)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          $raw = pwsh -NoProfile -File scripts/smoke-gpu.ps1 -DryRun
          $raw | Set-Content -Encoding utf8 reports/smoke-gpu-dry.json
          $doc = $raw | ConvertFrom-Json
          foreach ($k in @("ok", "dry_run", "app_launch", "backend_health", "import_ok", "checks")) {
            if (-not ($doc.PSObject.Properties.Name -contains $k)) { throw "smoke-gpu JSON missing $k" }
          }
          if (-not $doc.dry_run) { throw "dry-run must set dry_run=true" }
          if ($doc.ok) { throw "dry-run must not claim the machine passed" }

      - name: pytest (real media + live server, no GPU) → junit
        shell: pwsh
        env:
          CE_TEST_VENV: ${{ github.workspace }}\ai-engine\.venv
        run: ai-engine/.venv/Scripts/python.exe -m pytest tests -m "not gpu" -q -p no:cacheprovider -rfEs --junitxml=reports/junit-windows.xml

      - name: Annotate pytest failures (public annotations, no token needed)
        if: always()
        shell: pwsh
        run: python scripts/ci/junit_annotate.py reports/junit-windows.xml

      # S-010: the crate compiles → fmt/clippy/tests are hard checks (BUG-16 closed).
      # `tauri::generate_context!()` embeds `frontendDist` (../out) at compile time,
      # so the static export must exist before clippy/test can even type-check.
      - name: Frontend build (Turbo → next export) — required by generate_context!
        run: pnpm run build

      - name: cargo fmt --check (src-tauri)
        working-directory: apps/desktop/src-tauri
        shell: pwsh
        run: cargo fmt --all --check

      - name: cargo clippy -D warnings (src-tauri, all targets)
        working-directory: apps/desktop/src-tauri
        shell: pwsh
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test (src-tauri, health rules)
        working-directory: apps/desktop/src-tauri
        shell: pwsh
        run: cargo test --locked -- --nocapture

      - name: Icons match the deterministic generator (scripts/make_icons.py --check)
        shell: pwsh
        run: python scripts/make_icons.py --check

      # `tauri build` runs `pnpm build` (next export → apps/desktop/out) itself via
      # beforeBuildCommand, then compiles release and packs the NSIS installer.
      - name: tauri build → NSIS installer (*_x64-setup.exe)
        working-directory: apps/desktop
        shell: pwsh
        env:
          CI: 'true'
        run: pnpm exec tauri build --ci --verbose -- --locked

      # Kept so a reviewer can still see the lock digest without a token.
      # The file itself is committed (BUG-17); cargo/tauri steps above use --locked.
      - name: Cargo.lock → job summary (gzip+base64) for the lockfile commit
        if: hashFiles('apps/desktop/src-tauri/Cargo.lock') != ''
        working-directory: apps/desktop/src-tauri
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes("Cargo.lock")
          $ms = New-Object IO.MemoryStream
          $gz = New-Object IO.Compression.GzipStream($ms, [IO.Compression.CompressionLevel]::Optimal)
          $gz.Write($bytes, 0, $bytes.Length); $gz.Close()
          $b64 = [Convert]::ToBase64String($ms.ToArray())
          $sha = (Get-FileHash Cargo.lock).Hash
          Write-Output "::notice title=Cargo.lock::$($bytes.Length) bytes sha256 $sha (gzip+base64 in job summary)"
          $summary = @("## Cargo.lock ($($bytes.Length) bytes, sha256 $sha)", "", '```text')
          for ($i = 0; $i -lt $b64.Length; $i += 76) { $summary += $b64.Substring($i, [Math]::Min(76, $b64.Length - $i)) }
          $summary += '```'
          $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Installer smoke — silent install, launch, window title, silent uninstall
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/installer_smoke.ps1 -Report reports/installer-smoke.jsonl

      - name: Installer smoke → annotations + job summary (evidence readable via API)
        if: always() && hashFiles('reports/installer-smoke.jsonl') != ''
        shell: pwsh
        run: |
          $lines = Get-Content reports/installer-smoke.jsonl
          $ok = @($lines | ConvertFrom-Json | Where-Object { $_.ok }).Count
          Write-Output "::notice title=installer smoke::$ok/$($lines.Count) checks ok"
          $summary = @("## Installer smoke ($ok/$($lines.Count) ok)", "", "| check | ok | detail |", "|---|---|---|")
          foreach ($l in $lines) { $o = $l | ConvertFrom-Json; $summary += "| $($o.check) | $($o.ok) | $($o.detail -replace '\|', '/') |" }
          $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $bundle = Join-Path "apps/desktop/src-tauri" "target/release/bundle/nsis"
          $setup = Get-ChildItem -Path $bundle -Filter "*_x64-setup.exe" | Select-Object -First 1
          if ($setup) { Write-Output "::notice title=installer::$($setup.Name) $([math]::Round($setup.Length / 1MB, 2)) MB sha256 $((Get-FileHash $setup.FullName).Hash)" }

      - name: Upload installer (downloadable .exe on every push)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cutting-edge-windows-x64-setup
          if-no-files-found: error
          retention-days: 30
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*_x64-setup.exe

      - name: Upload windows evidence (junit)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            reports/junit-windows.xml
            reports/installer-smoke.jsonl
            apps/desktop/src-tauri/Cargo.lock

      # After artifacts, so a publish failure still leaves the .exe and junit.
      # No-ops once Cargo.lock is tracked (the --locked follow-up).
      - name: Publish Cargo.lock to the branch (sandbox has no cargo)
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoProfile -File scripts/ci/publish_cargo_lock.ps1

  # ───────────────────────────────────────────────────────────────────────────
  loop-audit:
    name: loop-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (full history so supervise can read commits)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Ledger integrity (verify_ledger.py)
        run: python scripts/verify_ledger.py

      - name: Supervisor checks (read-only; STOP verdict fails the job)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/supervise.py

      - name: Steps doc is generated from steps.json (no drift)
        run: |
          python scripts/loop/render_steps.py
          git diff --exit-code -- docs/loop/03_STEPS.md
