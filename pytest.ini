[pytest]
minversion = 7.0
testpaths = tests
markers =
    unit: fast, pure-import/API tests
    real: live-server / real-media tests (S-002 backend boot and later)
    heavy: heavy GPU/model tests (run on windows-heavy CI job)
    gpu: require a CUDA GPU (smoke-gpu.ps1 / user-gpu)
    e2e: end-to-end UI journeys
    perf: performance/budget tests
    chaos: self-healing chaos probes
addopts =
    --strict-markers
    -ra
