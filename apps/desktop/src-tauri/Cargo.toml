[package]
name = "cutting-edge"
version = "2.0.0"
description = "Cutting Edge — AI video editor for sports & fitness creators (desktop shell)"
authors = ["Cutting Edge v2 contributors"]
license = "MIT"
edition = "2021"
publish = false

# S-010 walking skeleton. Tauri 2 has no `shell-open` cargo feature (it moved to
# plugins); dialogs/opener/fs land in S-059, the Python sidecar in S-060.
[lib]
name = "cutting_edge_lib"
path = "src/lib.rs"

[[bin]]
name = "cutting-edge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
sysinfo = "0.32"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
