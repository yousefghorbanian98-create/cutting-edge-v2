[package]
name = "cutting-edge"
version = "2.0.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["shell-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.32"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
